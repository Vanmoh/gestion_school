server {
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # L'image nginx:alpine livre `gzip` commente dans nginx.conf: sans ce bloc,
  # main.dart.js part brut, soit 6,1 Mo par chargement au lieu de 1,7 Mo.
  # C'etait le premier poste de temps d'attente au demarrage de l'application.
  gzip on;
  gzip_comp_level 6;
  # 1024 et non 0: sous cette taille l'en-tete de compression coute plus que ce
  # qu'il economise.
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    application/wasm
    text/css
    text/plain
    image/svg+xml
    application/octet-stream;

  # Always refresh shell files to avoid stale app versions in normal browsing mode.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # `no-cache` et non `no-store`: Flutter ne met pas d'empreinte dans le nom du
  # fichier, il faut donc verifier sa fraicheur a chaque chargement -- mais
  # verifier n'est pas retelecharger. Avec `no-store`, les 6 Mo repartaient meme
  # sur un simple F5; avec `no-cache`, nginx repond 304 sur l'ETag tant que le
  # build n'a pas change, et le navigateur reutilise sa copie.
  location = /main.dart.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never fallback to index.html for Flutter asset files.
  location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Le moteur de rendu ne change qu'avec la version du SDK Flutter, et le
  # repertoire est reecrit a chaque image: un an de cache ne peut pas servir
  # une version perimee.
  location ^~ /canvaskit/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|json|wasm|bin|map)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
