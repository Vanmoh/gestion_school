name: gestion_school_app
description: "GESTION SCHOOL - Application de gestion scolaire multi-plateforme"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^10.0.0
  go_router: ^16.0.0
  fl_chart: ^0.71.0
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  file_picker: ^10.3.2
  excel: ^4.0.6
  web_socket_channel: ^3.0.3
  # Ouvre WhatsApp (ou WhatsApp Web) sur le lien wa.me prepare par le
  # serveur pour l'envoi des bulletins aux familles. Sans elle, l'ecran ne
  # saurait que copier le lien dans le presse-papiers, et il faudrait le
  # coller a la main soixante fois par classe.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  # Liste explicite et non le dossier entier: `- assets/images/` embarquait
  # 7,6 Mo dans le bundle web, dont 7,3 Mo de fichiers que plus aucune ligne de
  # `lib/` ne reference (anciens logos, gabarit de carte scolaire). Un fichier
  # ajoute ici doit donc etre declare -- c'est le prix pour que le poids
  # telecharge au demarrage reste celui des images reellement affichees.
  assets:
    - assets/images/ecole_photo.png
    - assets/images/logo_ecole.png
    - assets/images/logo_icone_application.png
    - assets/images/str_cachet_signature.png
    - assets/images/str_signature.png
  # Inter embarquee plutot que recuperee par google_fonts a l'execution.
  # Le paquet allait chercher ces memes fichiers sur fonts.gstatic.com apres le
  # demarrage de Flutter: un tiers a joindre avant que le texte s'affiche, un
  # re-rendu complet a l'arrivee, et une police de secours la ou le domaine est
  # injoignable -- sur mobile hors ligne, notamment.
  # Licence SIL OFL 1.1: assets/fonts/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Police de titre, pour le seul nom de l'ecole sur l'ecran d'accueil.
    # Inter dit tout le reste; deux caracteres qui se repondent valent mieux
    # qu'une graisse de plus sur la meme police. 46 Ko par graisse (jeu latin),
    # licence SIL OFL 1.1: assets/fonts/OFL-Sora.txt.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    # Repli pour les glyphes qu'Inter ne porte pas -- un emoji tape dans le
    # chat, un caractere d'un nom. CanvasKit va sinon chercher la police Noto
    # correspondante sur fonts.gstatic.com: injoignable sur le serveur d'une
    # ecole, il reessaie trois fois puis affiche un carre vide.
    #
    # La variante monochrome (865 Ko) et non NotoColorEmoji (11 Mo): le moteur
    # attend le chargement de toutes les familles declarees avant d'afficher
    # quoi que ce soit, et le serveur local repond `no-store`, donc ce poids
    # se paierait a chaque ouverture de page. Passer a la couleur ne tient
    # qu'a remplacer le fichier et ce nom.
    #
    # Licence SIL OFL 1.1: assets/fonts/OFL-NotoEmoji.txt.
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  windows:
    generate: true
  image_path: assets/images/logo_icone_application.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo_icone_application.png
