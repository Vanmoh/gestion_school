<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestion d'etablissement scolaire: eleves, notes, emplois du temps, presences, paiements et bulletins.">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=5, user-scalable=yes, viewport-fit=cover"
  >

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gestion Scolaire">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gestion Scolaire</title>
  <meta name="theme-color" content="#0F172A">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html,
    body,
    flt-glass-pane,
    flt-scene-host {
      /* Keep app interactions while allowing pinch zoom on mobile browsers. */
      touch-action: pan-x pan-y pinch-zoom !important;
    }

    /* Les valeurs du theme sombre de l'application, a l'identique.
       Cet ecran etait bleu clair (#eef4fb, accent #2563eb) alors que tout ce
       qui suit est nuit et violet: l'ouverture commencait donc par un flash
       blanc, suivi d'une inversion complete de luminosite en une seule image.
       Voir lib/core/theme/app_theme.dart, _darkScheme. */
    /* Les polices de l'application, des le premier trait.
       L'ecran de demarrage se contentait de "Segoe UI", Tahoma, Verdana: trois
       polices systeme dont aucune n'est celle de l'application, et dont le
       rendu change d'une machine a l'autre. Celles-ci sont deja dans le build
       -- le moteur les chargera de toute facon -- donc les nommer ici ne
       telecharge rien de plus.
       `font-display: swap`: le texte s'affiche tout de suite dans la police
       systeme et bascule des l'arrivee du fichier, plutot que de faire
       attendre un ecran vide. */
    @font-face {
      font-family: 'Inter';
      src: url('assets/assets/fonts/Inter-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('assets/assets/fonts/Inter-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('assets/assets/fonts/Inter-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: 'Sora';
      src: url('assets/assets/fonts/Sora-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --bg-1: #0F172A;                          /* surface */
      --bg-2: #131D33;                          /* surfaceContainerLow */
      --ink-strong: #E7ECF9;                    /* onSurface */
      --ink-soft: #9BA9C3;                      /* onSurfaceVariant */
      --accent: #8B5CF6;                        /* primary */
      --accent-2: #6366F1;                      /* secondary */
      --chip-bg: rgba(139, 92, 246, 0.12);
      --surface: rgba(13, 20, 38, 0.86);        /* surfaceContainerLowest */
      --surface-border: rgba(51, 68, 95, 0.8);  /* outlineVariant */
    }

    #boot-status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(1100px 500px at -10% -20%, rgba(139, 92, 246, 0.10) 0%, transparent 58%),
        radial-gradient(900px 480px at 110% 120%, rgba(56, 189, 248, 0.08) 0%, transparent 58%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-1) 100%);
      color: var(--ink-strong);
      font-family: 'Inter', "Segoe UI", Tahoma, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      z-index: 9999;
    }

    #boot-status::before,
    #boot-status::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(0.3px);
      pointer-events: none;
    }

    #boot-status::before {
      width: min(54vw, 640px);
      height: min(54vw, 640px);
      left: -16vw;
      top: -18vw;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(139, 92, 246, 0) 70%);
      animation: float-slow 8s ease-in-out infinite;
    }

    #boot-status::after {
      width: min(44vw, 520px);
      height: min(44vw, 520px);
      right: -12vw;
      bottom: -16vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, rgba(56, 189, 248, 0) 70%);
      animation: float-slow 9.5s ease-in-out infinite reverse;
    }

    /* Sortie en fondu. Le bloc etait retire par un `remove()` sec: l'ecran
       disparaissait d'un coup et l'application apparaissait en une seule
       image. */
    #boot-status.partir {
      opacity: 0;
      transition: opacity 260ms ease-out;
      pointer-events: none;
    }

    /* Image de fond de l'ecole, posee par le script depuis ce que le
       navigateur a memorise a la visite precedente. Le voile la laisse voir
       sans que le texte cesse d'etre lisible. */
    #boot-status .fond {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 500ms ease-out;
      pointer-events: none;
    }

    #boot-status .fond::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg,
        rgba(15, 23, 42, 0.72) 0%,
        rgba(15, 23, 42, 0.52) 55%,
        rgba(15, 23, 42, 0.78) 100%);
    }

    /* Quand l'ecole a depose un logo, il remplace le pictogramme dessine. */
    #boot-status .logo.avec-logo {
      background: rgba(255, 255, 255, 0.94);
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    #boot-status .logo.avec-logo svg {
      display: none;
    }

    #boot-status .panel {
      position: relative;
      width: min(92vw, 760px);
      padding: clamp(22px, 3vw, 34px);
      border-radius: 24px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      backdrop-filter: blur(9px);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.45),
        0 0 40px -12px rgba(139, 92, 246, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: panel-in 550ms ease-out;
    }

    #boot-status .identity {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    #boot-status .logo {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 24px rgba(139, 92, 246, 0.38);
    }

    #boot-status .title {
      font-family: 'Sora', 'Inter', "Segoe UI", sans-serif;
      font-size: clamp(30px, 4.2vw, 44px);
      font-weight: 800;
      letter-spacing: 0.3px;
      margin-bottom: 10px;
      line-height: 1.07;
      text-wrap: balance;
    }

    #boot-status .subtitle {
      font-size: clamp(12px, 1.8vw, 14px);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--ink-soft);
      font-weight: 700;
      margin-bottom: 8px;
    }

    #boot-status .message {
      font-size: clamp(15px, 2vw, 18px);
      max-width: 660px;
      line-height: 1.45;
      opacity: 0.95;
      color: var(--ink-soft);
      margin: 0 auto;
    }

    #boot-status .loading-row {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--ink-strong);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #boot-status .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      animation: pulse 1.25s ease-in-out infinite;
    }

    #boot-status .dot:nth-child(2) {
      animation-delay: 0.18s;
    }

    #boot-status .dot:nth-child(3) {
      animation-delay: 0.36s;
    }

    #boot-status .pillars {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #boot-status .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.10);
      border: 1px solid rgba(139, 92, 246, 0.26);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
    }

    #boot-status.error .title {
      color: #FDA29B;
    }

    #boot-status.error .logo {
      background: linear-gradient(140deg, #7A2018, #601410);
      box-shadow: 0 10px 24px rgba(253, 162, 155, 0.22);
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(0.92);
        opacity: 0.38;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes float-slow {
      0%,
      100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes panel-in {
      from {
        transform: translateY(10px) scale(0.985);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 640px) {
      #boot-status .panel {
        border-radius: 20px;
        padding: 20px 16px;
      }
      #boot-status .logo {
        width: 46px;
        height: 46px;
      }
    }
  </style>

  <div id="boot-status" role="status" aria-live="polite">
    <div class="fond" id="boot-fond" aria-hidden="true"></div>
    <div class="panel">
      <div class="identity">
        <div class="logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6.5C4 5.67 4.67 5 5.5 5H18.5C19.33 5 20 5.67 20 6.5V17.5C20 18.33 19.33 19 18.5 19H5.5C4.67 19 4 18.33 4 17.5V6.5Z" fill="rgba(255,255,255,0.23)"/>
            <path d="M6.5 7.2H17.5V16.8H6.5V7.2Z" stroke="white" stroke-width="1.6"/>
            <path d="M9 10.2H15M9 13.2H13.4" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="subtitle">Plateforme Education</div>
      </div>

      <div class="title">Gestion School</div>
      <div class="message">Initialisation de l'espace scolaire: classes, emplois du temps, notes et suivi administratif...</div>

      <div class="loading-row" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span>Chargement securise</span>
      </div>

      <div class="pillars" aria-hidden="true">
        <span class="pill">Eleves</span>
        <span class="pill">Enseignants</span>
        <span class="pill">Bulletins</span>
        <span class="pill">Presences</span>
        <span class="pill">Paiements</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const statusEl = document.getElementById('boot-status');
      const messageEl = statusEl ? statusEl.querySelector('.message') : null;
      let mounted = false;
      let retryInjected = false;

      function showError(message) {
        if (!statusEl || !messageEl) {
          return;
        }
        statusEl.classList.add('error');
        messageEl.textContent =
          message || 'Une erreur de chargement est survenue. Rechargez la page (Ctrl+F5).';
      }

      function hasMountedFlutter() {
        return Boolean(document.querySelector('flt-glass-pane, flt-scene-host, canvas'));
      }

      function removeBootStatus() {
        if (!statusEl || statusEl.classList.contains('partir')) {
          return;
        }
        statusEl.classList.add('partir');
        // Le noeud part apres le fondu. `once` evite qu'un second evenement
        // -- la transition du fond, par exemple -- ne rappelle le retrait.
        statusEl.addEventListener('transitionend', function () {
          statusEl.remove();
        }, { once: true });
        // Filet: si la transition ne se declenche pas (onglet en arriere-plan,
        // mouvement reduit), le noeud resterait sur l'ecran pour toujours.
        window.setTimeout(function () {
          statusEl.remove();
        }, 500);
      }

      /* L'identite de l'ecole, telle que la visite precedente l'a laissee.
         Ce script s'execute avant Flutter: interroger l'API ici retarderait le
         premier trait, et le stockage des jetons est chiffre donc illisible.
         L'application ecrit donc ces quelques valeurs en clair, sous une cle a
         elle, et l'ecran de demarrage les relit. Rien au premier lancement:
         les libelles d'origine suffisent, et l'ecole paraitra des la fois
         suivante. */
      function poserLIdentite() {
        let marque = null;
        try {
          const brut = window.localStorage.getItem('gs.marque');
          if (!brut) {
            return;
          }
          marque = JSON.parse(brut);
        } catch (erreur) {
          // Navigation privee, ou valeur abimee: on garde les libelles ecrits
          // dans la page.
          return;
        }
        if (!marque) {
          return;
        }

        if (marque.nom) {
          const titre = statusEl ? statusEl.querySelector('.title') : null;
          if (titre) {
            titre.textContent = marque.nom;
          }
          document.title = marque.nom;
        }

        if (marque.couleur && /^#[0-9a-fA-F]{6}$/.test(marque.couleur)) {
          document.documentElement.style.setProperty('--accent', marque.couleur);
        }

        if (marque.logo) {
          const pastille = statusEl ? statusEl.querySelector('.logo') : null;
          if (pastille) {
            const image = new Image();
            image.onload = function () {
              pastille.style.backgroundImage = 'url("' + marque.logo + '")';
              pastille.classList.add('avec-logo');
            };
            // Un logo introuvable laisse le pictogramme dessine en place.
            image.src = marque.logo;
          }
        }
      }

      /* L'image de fond de l'ecole, telle que la visite precedente l'a laissee.
         Ce script s'execute avant Flutter: interroger l'API ici retarderait le
         premier trait, et le stockage des jetons est chiffre donc illisible.
         L'application ecrit donc cette seule adresse en clair, sous une cle a
         elle, et l'ecran de demarrage la relit. Rien au premier lancement: le
         fond degrade suffit, et l'image sera la des la fois suivante. */
      function poserLeFond() {
        const noeud = document.getElementById('boot-fond');
        if (!noeud) {
          return;
        }
        let adresse = '';
        try {
          const brut = window.localStorage.getItem('gs.marque');
          adresse = brut ? (JSON.parse(brut).fond || '') : '';
        } catch (erreur) {
          // Navigation privee, stockage refuse: on garde le fond dessine.
          return;
        }
        if (!adresse) {
          return;
        }
        const image = new Image();
        image.onload = function () {
          noeud.style.backgroundImage = 'url("' + adresse + '")';
          noeud.style.opacity = '1';
        };
        // Une adresse perimee ne doit rien casser: on n'affiche simplement rien.
        image.src = adresse;
      }

      poserLIdentite();
      poserLeFond();

      function ensureBootstrapScript() {
        if (retryInjected || hasMountedFlutter()) {
          return;
        }
        retryInjected = true;
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + Date.now();
        script.defer = true;
        document.body.appendChild(script);
      }

      // If Flutter does not mount anything after a while, show a clear message.
      window.setTimeout(function () {
        if (!hasMountedFlutter()) {
          showError('Le demarrage prend plus de temps que prevu. Patientez encore quelques secondes ou rechargez (Ctrl+F5).');
          ensureBootstrapScript();
        }
      }, 45000);

      // Retry bootstrap injection once if initial script execution is delayed.
      window.setTimeout(function () {
        if (!hasMountedFlutter()) {
          ensureBootstrapScript();
        }
      }, 9000);

      const mountWatcher = window.setInterval(function () {
        if (hasMountedFlutter()) {
          mounted = true;
          window.clearInterval(mountWatcher);
          removeBootStatus();
        }
      }, 350);

      window.addEventListener('error', function () {
        if (!mounted) {
          showError('Le navigateur a rencontre un probleme au demarrage. Rechargez la page (Ctrl+F5).');
        }
      });

      window.addEventListener('unhandledrejection', function () {
        if (!mounted) {
          showError('Une erreur JavaScript est survenue au chargement. Rechargez la page (Ctrl+F5).');
        }
      });

      window.__hideBootStatus = function () {
        removeBootStatus();
      };
    })();
  </script>
  <!--
    pdf.js servi par nous, jamais par unpkg.com.

    Le paquet printing va chercher https://unpkg.com/pdfjs-dist@3.2.146/ au
    premier apercu, puis attend le chargement du script sans delai maximal
    (printing_web.dart, lignes 70 a 113). Sans Internet le script n'arrive
    jamais, l'attente ne se termine jamais, et tout PdfPreview tourne
    indefiniment: bulletins, emploi du temps, listes de classe, pieces
    jointes du chat. Imprimer et telecharger n'empruntent pas ce chemin et
    fonctionnaient deja.

    Deux verrous, et il en faut deux:
    - dartPdfJsBaseUrl deroute l'injection vers notre copie si elle a lieu
      (ligne 97);
    - le prechargement ci-dessous rend `_hasPdfJsLib` vrai (ligne 58), et
      l'injection n'a alors pas lieu du tout. C'est la ceinture; la premiere
      reste la bretelle, pour le jour ou le paquet changera son test.

    Chemins relatifs: ils se resolvent contre <base href> et survivent donc a
    un service sous sous-chemin. `defer` garde l'ordre du document, donc
    pdf.js s'execute avant flutter_bootstrap.js. Le `onerror` est explicite
    parce que l'echec de chargement d'un <script> ne remonte pas jusqu'au
    veilleur `window.addEventListener('error')` pose plus haut.
  -->
  <script>window.dartPdfJsBaseUrl = 'pdfjs/';</script>
  <script defer src="pdfjs/pdf.min.js"
          onload="window.pdfjsLib && (pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js');"
          onerror="console.error('pdf.js local introuvable (web/pdfjs/): les apercus PDF ne fonctionneront pas hors ligne.');"></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
