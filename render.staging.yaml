services:
  - type: web
    name: gestion-school-staging-api
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    branch: staging
    healthCheckPath: /api/docs/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gestion-school-staging-web.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # Comme en production: sans elle, les liens envoyes aux familles
      # reprennent l'adresse de la requete et ne sortent pas du reseau local.
      - key: PUBLIC_BASE_URL
        value: "https://gestion-school-staging-api.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: USE_X_FORWARDED_HOST
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

  - type: web
    name: gestion-school-staging-web
    env: docker
    plan: free
    rootDir: frontend/gestion_school_app
    dockerfilePath: ./Dockerfile.web.staging
    autoDeploy: true
    branch: staging
    healthCheckPath: /
