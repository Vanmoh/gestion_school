name: CI

# Les 141 tests backend et les tests Flutter existaient sans jamais etre
# executes automatiquement: rien n'empechait une regression d'atteindre main.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gestion_user
          POSTGRES_PASSWORD: gestion_password
          POSTGRES_DB: gestion_school
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gestion_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: "True"
      SECRET_KEY: cle-de-test-ci-non-utilisee-en-production-0123456789
      DATABASE_URL: postgresql://gestion_user:gestion_password@localhost:5432/gestion_school
      ENABLE_FILE_LOGGING: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dependances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # requirements-dev tire requirements.txt, mysqlclient compris.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev pkg-config build-essential
          pip install -r requirements-dev.txt

      - name: Migrations manquantes
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: python manage.py test --parallel 4

      - name: Controles de deploiement
        working-directory: backend
        # Rejoue la configuration de production: c'est la seule facon de voir
        # les avertissements qui n'apparaissent jamais avec DEBUG=True.
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: gestion-school-jkzf.onrender.com
          CORS_ALLOWED_ORIGINS: https://gestion-school-web.onrender.com
          AWS_STORAGE_BUCKET_NAME: bucket-de-controle-ci
          AWS_S3_ENDPOINT_URL: https://exemple.invalid/storage/v1/s3
        # --fail-level WARNING echouerait sur la centaine d'avertissements de
        # documentation drf-spectacular, sans rapport avec le deploiement. La
        # porte ne retient donc que les controles de securite et ceux du projet.
        run: |
          python manage.py check --deploy 2>&1 | tee deploy-check.log
          if grep -E '^\?: \((security|gestion_school)\.' deploy-check.log; then
            echo "::error::Controles de deploiement en echec (voir ci-dessus)"
            exit 1
          fi
          echo "Aucun avertissement de securite ni de configuration projet."

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependances
        working-directory: frontend/gestion_school_app
        run: flutter pub get

      - name: Analyse statique
        working-directory: frontend/gestion_school_app
        run: flutter analyze

      - name: Tests
        working-directory: frontend/gestion_school_app
        run: flutter test
